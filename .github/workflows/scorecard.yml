name: OpenSSF Scorecard
# #232. Scores the repository against the OpenSSF Scorecard checks (pinned dependencies, token
# permissions, branch protection, dangerous workflows, signed releases, vulnerability disclosure, ...)
# and uploads the result to code scanning. Results are not published to the public Scorecard API:
# set publish_results to true for that and for a badge.
on:
  schedule:
    - cron: '47 5 * * 3'
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:
permissions: {}
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # to upload the SARIF result to code scanning
      id-token: write # Scorecard's own requirement, used only when publish_results is true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
