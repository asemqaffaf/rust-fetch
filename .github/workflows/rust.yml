name: CI

on:
  push:
    branches: [ "main" ]
  # Every pull request, including stacked ones whose base is another branch
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests + coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: wasm-module
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview, rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wasm-module
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Check formatting
        run: cargo fmt --check
      # Every `unsafe` is listed with its invariants in docs/unsafe.md; a new one fails here
      - name: Unsafe inventory
        working-directory: .
        run: node scripts/check-unsafe.mjs
      - name: Build (wasm32)
        run: cargo build --target wasm32-unknown-unknown
      # A panic aborts the Wasm module: no unwrap/expect in library code (deny set in src/lib.rs)
      - name: Panic lints (native and wasm32)
        run: |
          cargo clippy --lib -- -A clippy::all -A clippy::pedantic
          cargo clippy --lib --target wasm32-unknown-unknown -- -A clippy::all -A clippy::pedantic
      - name: Unit + integration tests with coverage
        # JS-only code (src/wasm, src/http.rs) needs a JS engine and is
        # covered by the wasm and JS jobs below. Coverage is measured
        # unoptimized: with profile.test's opt-level = 2, inlining differs
        # between test binaries and llvm-cov drops their "mismatched" data.
        run: cargo llvm-cov --no-report
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: 0
      - name: Coverage report
        run: cargo llvm-cov report --ignore-filename-regex 'src/(wasm/|http\.rs)|tests/' --show-missing-lines
      # Codecov steps are skipped until a CODECOV_TOKEN secret exists
      - name: Export coverage for Codecov
        if: env.CODECOV_TOKEN != ''
        run: cargo llvm-cov report --ignore-filename-regex 'src/(wasm/|http\.rs)|tests/' --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: wasm-module/lcov.info
          flags: rust
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage gate (100% lines and functions)
        run: >
          cargo llvm-cov report
          --ignore-filename-regex 'src/(wasm/|http\.rs)|tests/'
          --fail-under-lines 100
          --fail-under-functions 100

  dependencies:
    name: Dependency audit (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wasm-module/Cargo.toml
      - name: Native transport dependencies (same policy)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: native/Cargo.toml
          arguments: --all-features --config wasm-module/deny.toml

  semver:
    name: Rust API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          manifest-path: wasm-module/Cargo.toml
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  npm-audit:
    name: JavaScript dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "docs", "examples", "wasm-module/js/test/runtimes"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Audit the committed graph without installing packages or running scripts.
      - name: Check all locked dependencies for known vulnerabilities
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=low

  native:
    name: Native transport (format, lints)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings

  wasm:
    name: Wasm + JS tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            wasm-module
            native
      # wasm-pack and the tools it fetches (wasm-opt from binaryen, wasm-bindgen) come from GitHub releases,
      # whose downloads failed for hours on 2026-11-08. Keeping them in the Actions cache means a run only
      # downloads them once. The versions are in the key, so changing the wasm-pack pin or binaryen's
      # version (wasm-pack's) starts a fresh cache.
      - name: Restore wasm-pack and its tools
        id: wasm-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/.wasm-pack
            ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-binaryen-117-${{ runner.os }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        with:
          tool: wasm-pack@0.15.0 # pinned: wasm-opt, and so the published Wasm, depends on it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install JS dev dependencies
        run: npm ci
      - name: Wasm unit tests (Node)
        working-directory: wasm-module
        run: wasm-pack test --node
      - name: Build npm package
        run: scripts/ci-build-wasm.sh
      # The JS tests run against both Node transports: native, and node:http
      # (the *-js.test.mjs files, with the addon disabled)
      - name: Build native transport
        run: npm run build:native
      - name: JS integration + package tests
        run: npm run test:js
        env:
          # Node.js 20 has WebSocket behind a flag; without it the WebSocket tests would be skipped there
          NODE_OPTIONS: ${{ matrix.node == 20 && '--experimental-websocket' || '' }}
      - name: Node transport coverage (100% lines and functions)
        if: matrix.node == 22
        run: npm run coverage:js
      # Coverage is measured on the built copy in pkg/; report it against the source
      - name: Map Node transport coverage to its source
        if: matrix.node == 22 && env.CODECOV_TOKEN != ''
        run: sed -i 's#^SF:wasm-module/pkg/node.js$#SF:wasm-module/js/node.js#' lcov-js.info
      - name: Upload Node transport coverage to Codecov
        if: matrix.node == 22 && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov-js.info
          flags: js
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Size budget
        if: matrix.node == 22
        run: npm run size
      - name: Share the built package with the browser job
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg
          path: wasm-module/pkg
          retention-days: 1
      - name: TypeScript API unchanged (or snapshot updated)
        if: matrix.node == 22
        run: npm run api:check

  benchmarks:
    name: Benchmarks (PR against base and npm release, informational)
    if: github.event_name == 'pull_request'
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The PR's package, built by the Node 22 leg (with the native addon)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: head-pkg
      - name: Check out the base branch
        run: git worktree add base ${{ github.event.pull_request.base.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            base/wasm-module
            base/native
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack@0.15.0 # pinned: wasm-opt, and so the published Wasm, depends on it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Build the base package
        working-directory: base
        run: npm ci && ([ -f scripts/ci-build-wasm.sh ] && scripts/ci-build-wasm.sh || ../scripts/ci-build-wasm.sh) && npm run build:native
      # The release workflow gates on the version published on npm, so show the
      # cumulative change against it too, not only against the PR's base (#182)
      - name: Install the published release
        run: |
          mkdir -p "$RUNNER_TEMP/published" && cd "$RUNNER_TEMP/published"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts rust-fetch@latest
          echo "PUBLISHED=$RUNNER_TEMP/published/node_modules/rust-fetch" >> "$GITHUB_ENV"
          echo "PUBLISHED_VERSION=$(node -p "require('./node_modules/rust-fetch/package.json').version")" >> "$GITHUB_ENV"
          echo "CANDIDATE_VERSION=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" >> "$GITHUB_ENV"
      # #180/#181 use the pre-2.7 release as their reference. Comparing only
      # with the current npm release would hide the cumulative 2.7 costs.
      - name: Build the 2.6.1 reference for 2.7 maintenance
        if: startsWith(env.CANDIDATE_VERSION, '2.7.')
        run: |
          git worktree add historical v2.6.1
          historical_pkg="$RUNNER_TEMP/historical-2.6.1"
          mkdir -p "$historical_pkg"
          (cd "$historical_pkg" && npm init -y >/dev/null && npm install --no-audit --no-fund --ignore-scripts rust-fetch@2.6.1)
          # Keep versions of the same crate in separate target directories,
          # so the historical build cannot replace the cached base addon.
          cargo build --manifest-path historical/native/Cargo.toml --release
          addon="rust-fetch-native.$(node -p 'process.platform + "-" + process.arch').node"
          cp historical/native/target/release/librust_fetch_native.so "$historical_pkg/node_modules/rust-fetch/$addon"
          echo "HISTORICAL_PKG=$historical_pkg/node_modules/rust-fetch" >> "$GITHUB_ENV"
          # The 2.6.2 backport changes JS/Wasm hardening, not native code.
          # Verify this before sharing the historical native binary.
          git diff --exit-code v2.6.1 v2.6.2 -- native/src native/build.rs
          python3 - <<'PYTHON'
          import subprocess, tomllib
          for path in ['native/Cargo.toml', 'native/Cargo.lock']:
              baseline, patched = [tomllib.loads(subprocess.check_output(['git', 'show', f'{tag}:{path}'], text=True)) for tag in ['v2.6.1', 'v2.6.2']]
              for data in [baseline, patched]:
                  packages = [data['package']] if path.endswith('Cargo.toml') else data['package']
                  for package in packages:
                      if package['name'] == 'rust-fetch-native':
                          package['version'] = 'historical-comparison'
              assert baseline == patched, f'{path}: the patched reference needs its own native build'
          PYTHON
          hardened_pkg="$RUNNER_TEMP/historical-2.6.2"
          mkdir -p "$hardened_pkg"
          (cd "$hardened_pkg" && npm init -y >/dev/null && npm install --no-audit --no-fund --ignore-scripts rust-fetch@2.6.2)
          cp "$historical_pkg/node_modules/rust-fetch/$addon" "$hardened_pkg/node_modules/rust-fetch/$addon"
          echo "HARDENED_PKG=$hardened_pkg/node_modules/rust-fetch" >> "$GITHUB_ENV"
      - name: Compare (results in the job summary)
        run: |
          historical_args=()
          if [ -n "$HISTORICAL_PKG" ]; then
            historical_args+=(--also "Benchmarks: cumulative 2.7 change against rust-fetch@2.6.1 (rebuilt native addon)=$HISTORICAL_PKG")
            historical_args+=(--also "Benchmarks: this PR against security-patched rust-fetch@2.6.2 (identical native sources and dependencies)=$HARDENED_PKG")
          fi
          node benchmarks/compare.mjs base/wasm-module/pkg head-pkg \
            --also "Benchmarks: this PR against rust-fetch@$PUBLISHED_VERSION from npm (what the release gate compares; no native addon)=$PUBLISHED" \
            "${historical_args[@]}"

  package:
    name: Packed package (contents, security suite, against npm)
    # The checks the release runs before publishing (scripts/check-package.mjs),
    # here informational: the benchmark doesn't fail the job on a noisy runner
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: wasm-module/pkg
      - name: Check the packed package (benchmark in the job summary)
        run: node scripts/check-package.mjs

  runtimes:
    name: ${{ matrix.runtime }} (smoke tests)
    # Bun and Deno run the Node.js entry of the built package against local servers; workerd, the
    # open-source Cloudflare Workers runtime, runs the browser entry (#48).
    # Their binaries come from the locked npm manifest in wasm-module/js/test/runtimes.
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, workerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: wasm-module/pkg
      - name: Install the runtime
        working-directory: wasm-module/js/test/runtimes
        run: npm ci
      - name: Smoke tests on Bun
        if: matrix.runtime == 'bun'
        working-directory: wasm-module/js/test/runtimes
        run: ./node_modules/.bin/bun run smoke.mjs
      - name: Smoke tests on Deno
        if: matrix.runtime == 'deno'
        working-directory: wasm-module/js/test/runtimes
        run: ./node_modules/.bin/deno run --allow-all smoke.mjs
      - name: Smoke test on workerd (the Cloudflare Workers runtime)
        if: matrix.runtime == 'workerd'
        working-directory: wasm-module/js/test/runtimes
        run: node workers.mjs

  browsers:
    name: Browsers (Chromium, Firefox, WebKit)
    # Playwright's image has the browsers and their system libraries preinstalled;
    # installing them with apt on the runner took up to half an hour
    needs: wasm
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install JS dev dependencies
        run: npm ci
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: wasm-module/pkg
      - name: Browser tests
        run: npm run test:browsers
      # Every adapter (node:http, native, fetch() in Node.js, Chromium, Firefox,
      # WebKit) on the same cases; fails on any undocumented difference, or a
      # CONFORMANCE.md that doesn't match the results
      - name: Transport conformance
        run: npm run test:conformance

  webkit-uploads:
    name: WebKit uploads (macOS)
    # WebKit's Linux Soup backend rejects upload streams. Exercise Cocoa too.
    needs: wasm
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: wasm-module/pkg
      - name: WebKit streaming uploads over HTTP/2
        run: node --test wasm-module/js/test/browser-uploads.test.mjs
