name: Workflow security lint
on:
  push:
    branches: ["main"]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
permissions:
  contents: read
jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Template injection, excessive permissions, unpinned actions, credential persistence.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
