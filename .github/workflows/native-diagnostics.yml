name: Native performance diagnosis
on:
  push:
    branches: [perf/2.7-native-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: git worktree add historical v2.6.1
      - run: git worktree add patched v2.6.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            native
            historical/native
            patched/native
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pkg
          path: control-pkg
          run-id: 41444800485
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pkg
          path: completion-pkg
          run-id: 41446558453
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pkg
          path: exact-pkg
          run-id: 41480854946
          github-token: ${{ github.token }}
      - name: Build candidate and historical addons
        run: |
          cp -R exact-pkg oldwasm-pkg
          git show c9e847d:wasm-module/pkg/rust_fetch_bg.wasm > oldwasm-pkg/rust_fetch_bg.wasm
          git show c9e847d:wasm-module/pkg/rust_fetch.js > oldwasm-pkg/rust_fetch.js
          npm run build:native
          node historical/scripts/build-native.mjs
          node patched/scripts/build-native.mjs
          mkdir -p "$RUNNER_TEMP/reference"
          (cd "$RUNNER_TEMP/reference" && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund rust-fetch@2.6.1)
          cp historical/wasm-module/pkg/rust-fetch-native.linux-x64.node "$RUNNER_TEMP/reference/node_modules/rust-fetch/"
          mkdir -p "$RUNNER_TEMP/patched"
          (cd "$RUNNER_TEMP/patched" && npm init -y >/dev/null && npm install --ignore-scripts --no-audit --no-fund rust-fetch@2.6.2)
          cp patched/wasm-module/pkg/rust-fetch-native.linux-x64.node "$RUNNER_TEMP/patched/node_modules/rust-fetch/"
      - name: Profile native concurrency
        env:
          NATIVE_PROFILE_DIR: ${{ runner.temp }}/native-profiles
        run: node benchmarks/native-diagnostics.mjs historical="$RUNNER_TEMP/reference/node_modules/rust-fetch" patched="$RUNNER_TEMP/patched/node_modules/rust-fetch" cold=wasm-module/pkg exact=exact-pkg oldwasm=oldwasm-pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-profiles
          path: ${{ runner.temp }}/native-profiles
