name: Parser and JS boundary fuzzing
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'wasm-module/src/**'
      - 'wasm-module/fuzz/**'
      - 'wasm-module/js/**'
      - 'scripts/fuzz-js-boundary.mjs'
      - 'scripts/fuzz-node-boundary.mjs'
      - '.github/workflows/fuzz.yml'
permissions:
  contents: read
jobs:
  parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # to download the corpus of the last scheduled run
    strategy:
      fail-fast: false
      matrix:
        target: [sse, lines, retry_after, urls, headers, multipart]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-10-28
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: wasm-module/fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The corpus persists between runs (#231): each scheduled run starts from what the last one found,
      # so coverage accumulates instead of restarting from the seeds every day
      - name: Restore the corpus from the last scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          run=$(gh run list --workflow fuzz.yml --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --name "corpus-$TARGET" --dir "wasm-module/fuzz/corpus/$TARGET"; then
            echo "Restored the corpus of run $run: $(find "wasm-module/fuzz/corpus/$TARGET" -type f | wc -l) files"
          else
            echo "No corpus to restore; starting from the seeds"
          fi
      - name: Fuzz actual parsers
        working-directory: wasm-module
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
        run: |
          duration=15
          if [ "$EVENT" != pull_request ]; then duration=180; fi
          cargo fuzz run "$TARGET" -- -max_total_time="$duration" -max_len=65536 -rss_limit_mb=1024
      - name: Minimize the corpus
        if: github.event_name != 'pull_request'
        working-directory: wasm-module
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz cmin "$TARGET" -- -max_len=65536 -rss_limit_mb=1024
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request'
        with:
          name: corpus-${{ matrix.target }}
          path: wasm-module/fuzz/corpus/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: wasm-module/fuzz/artifacts/
          if-no-files-found: ignore
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: wasm-pack@0.15.0 # pinned: wasm-opt, and so the published Wasm, depends on it
      - run: npm ci && npm run build
      - run: node scripts/fuzz-js-boundary.mjs
        env:
          FUZZ_CASES: 10000
      - name: Node.js transport parsers (proxy and NO_PROXY, redirect Location, Content-Type, decompression) (#231)
        run: node scripts/fuzz-node-boundary.mjs
        env:
          FUZZ_CASES: 5000
      - name: URL resolution against the WHATWG URL parser (#217)
        run: node scripts/fuzz-url-differential.mjs
        env:
          FUZZ_CASES: 20000
  report:
    needs: [parsers, boundary]
    if: always() && github.event_name == 'schedule' && (needs.parsers.result == 'failure' || needs.boundary.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report scheduled failures without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scheduled fuzzing failure"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = 0 ]; then
            report="$RUNNER_TEMP/fuzz-report.md"
            printf 'Scheduled parser or JS/Wasm boundary fuzzing failed.\n\nRun and reproducer artifacts: %s/%s/actions/runs/%s\n\nA crash may be a vulnerability. Triage it before discussing details here: if it is exploitable, report it privately through a GitHub Security Advisory (SECURITY.md) and keep the reproducer out of this issue until the fix is released. Otherwise minimize the failing seed and add a regression test before closing.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$report"
            gh issue create --title "$title" --body-file "$report"
          fi
