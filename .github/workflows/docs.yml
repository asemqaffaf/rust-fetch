name: Docs

# The documentation site (docs/, VitePress): built and link-checked on every
# pull request that touches it, and published to GitHub Pages from main.
on:
  push:
    branches: ["main"]
    paths: ["docs/**", "README.md", "CONFORMANCE.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "CONFORMANCE.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # for each page's "last updated" date
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build (fails on dead links; then checks every anchor)
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
