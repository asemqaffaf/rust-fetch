name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing
    env:
      # Optional: without it, npm trusted publishing (OIDC) is used
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          targets: wasm32-unknown-unknown
      # No build caches in the publishing workflow: a poisoned cache could alter the published package.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: wasm-pack@0.15.0 # pinned: wasm-opt, and so the published Wasm, depends on it
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install JS dev dependencies
        run: npm ci
      - name: Build
        run: scripts/ci-build-wasm.sh

      - name: Reproducible build (blocks the release)
        # What is published must be what the tagged source builds to: two clean builds in different
        # directories must agree with each other and with the Wasm built above (#232)
        env:
          COMPARE_WORKSPACE: '1'
        run: scripts/check-wasm-reproducible.sh

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./wasm-module/pkg/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          npm run test:rust
          (cd wasm-module && wasm-pack test --node)
          npm run test:js
          npm run size
          npm run api:check

      - name: Choose npm dist-tag
        # A patch for an older line (a 1.x patch after 2.0, or 2.5.3 after 2.6.1)
        # must not become "latest". npm rejects tags that look like version
        # ranges (v2, v2.5), so those lines publish under release-<major>.<minor>.
        run: |
          latest=$(npm view rust-fetch version 2>/dev/null || echo 0.0.0)
          if [[ "$VERSION" == *-* ]]; then
            tag=next
          elif [ "$(printf '%s\n%s\n' "$VERSION" "$latest" | sort -V | tail -n1)" = "$VERSION" ]; then
            tag=latest
          else
            tag="release-${VERSION%.*}"
          fi
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $VERSION with dist-tag $tag"

      - name: Check whether this version is already published
        # Makes the workflow safe to re-run after a later step failed
        run: |
          if npm view "rust-fetch@$VERSION" version >/dev/null 2>&1; then
            echo "rust-fetch@$VERSION is already on npm; skipping publish"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Check the packed package
        # The tarball npm will receive: contents, a smoke test, the security
        # suite, and a benchmark against the version on this dist-tag, which
        # fails the release on a regression (scripts/check-package.mjs)
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          baseline="$DIST_TAG"
          if [[ "$DIST_TAG" == release-* ]]; then
            # Compare with the newest published version of the same line
            baseline=$(npm view rust-fetch versions --json | node -e '
              const line = process.argv[1];
              const versions = JSON.parse(require("fs").readFileSync(0, "utf8")).filter((v) => v.startsWith(`${line}.`) && !v.includes("-"));
              versions.sort((a, b) => a.split(".")[2] - b.split(".")[2]);
              console.log(versions.at(-1) ?? "");
            ' "${VERSION%.*}")
          fi
          if [ -n "$baseline" ] && npm view "rust-fetch@$baseline" version >/dev/null 2>&1; then
            node scripts/check-package.mjs --strict --baseline "$baseline"
          else
            node scripts/check-package.mjs --strict --no-bench
          fi

      - name: Use npm 11.5.1+ (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Publish to npm (token)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN != ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to npm (trusted publishing)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN == ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Verify the published package
        # A clean install from the registry: the signature and the provenance
        # attestation must verify. The registry can take a few minutes to serve
        # the version and its attestation, so both the install and the check
        # are retried (about 10 minutes). An invalid signature or attestation
        # fails at once: waiting won't fix it.
        run: |
          mkdir verify && cd verify && npm init -y >/dev/null
          for attempt in $(seq 1 30); do
            if [ ! -d node_modules/rust-fetch ]; then
              npm install --no-audit --no-fund --prefer-online "rust-fetch@$VERSION" >/dev/null 2>&1 || { sleep 20; continue; }
              installed=$(node -p "require('./node_modules/rust-fetch/package.json').version")
              if [ "$installed" != "$VERSION" ]; then
                echo "::error::Installed rust-fetch@$installed, expected $VERSION"
                exit 1
              fi
            fi
            npm audit signatures > signatures.txt 2>&1 && status=0 || status=$?
            cat signatures.txt
            if grep -qi "invalid" signatures.txt; then
              echo "::error::rust-fetch@$VERSION has an invalid signature or attestation"
              exit 1
            fi
            if [ "$status" = 0 ] && grep -q "verified attestation" signatures.txt; then
              exit 0
            fi
            echo "Attempt $attempt: not verified yet; retrying in 20 s"
            sleep 20
          done
          echo "::error::rust-fetch@$VERSION's signature and provenance didn't verify within about 10 minutes"
          exit 1

      - name: Create GitHub release
        # Release notes are this version's section of CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "rust-fetch $VERSION" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Attach the published tarball and its Sigstore signature to the release
        # The tarball is downloaded from the registry, so the signed bytes are
        # the bytes users install. The keyless signature is bound to this
        # workflow's identity (GitHub OIDC) and recorded in the Rekor log.
        run: |
          mkdir release-assets && cd release-assets
          npm pack "rust-fetch@$VERSION" >/dev/null
          cosign sign-blob --yes --bundle "rust-fetch-$VERSION.tgz.sigstore.json" "rust-fetch-$VERSION.tgz"
          gh release upload "$GITHUB_REF_NAME" "rust-fetch-$VERSION.tgz" "rust-fetch-$VERSION.tgz.sigstore.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
