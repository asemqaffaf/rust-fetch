name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Optional: without it, npm trusted publishing (OIDC) is used
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch on 2026-10-24
        with:
          toolchain: 1.99.1 # pinned: bump deliberately (sizes and rustfmt output change with it)
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wasm-module
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install JS dev dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./wasm-module/pkg/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          npm run test:rust
          (cd wasm-module && wasm-pack test --node)
          npm run test:js
          npm run size
          npm run api:check

      - name: Choose npm dist-tag
        # Older majors (e.g. a 1.x patch after 2.0) must not become "latest"
        run: |
          major=${VERSION%%.*}
          latest=$(npm view rust-fetch version 2>/dev/null || echo 0.0.0)
          if [[ "$VERSION" == *-* ]]; then
            tag=next
          elif [ "$major" -lt "${latest%%.*}" ]; then
            tag="v$major"
          else
            tag=latest
          fi
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $VERSION with dist-tag $tag"

      - name: Check whether this version is already published
        # Makes the workflow safe to re-run after a later step failed
        run: |
          if npm view "rust-fetch@$VERSION" version >/dev/null 2>&1; then
            echo "rust-fetch@$VERSION is already on npm; skipping publish"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Check the packed package
        # The tarball npm will receive: contents, a smoke test, the security
        # suite, and a benchmark against the version on this dist-tag, which
        # fails the release on a regression (scripts/check-package.mjs)
        if: env.ALREADY_PUBLISHED != 'true'
        run: |
          if npm view "rust-fetch@$DIST_TAG" version >/dev/null 2>&1; then
            node scripts/check-package.mjs --strict --baseline "$DIST_TAG"
          else
            node scripts/check-package.mjs --strict --no-bench
          fi

      - name: Use npm 11.5.1+ (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Publish to npm (token)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN != ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to npm (trusted publishing)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN == ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Verify the published package
        # A clean install from the registry: the signature and the provenance
        # attestation must verify. The registry can take a few minutes.
        run: |
          mkdir verify && cd verify && npm init -y >/dev/null
          for attempt in $(seq 1 30); do
            npm install --no-audit --no-fund --prefer-online "rust-fetch@$VERSION" >/dev/null 2>&1 && break
            sleep 20
          done
          node -e "const v = require('./node_modules/rust-fetch/package.json').version; if (v !== process.env.VERSION) throw new Error('installed ' + v)"
          npm audit signatures | tee signatures.txt
          grep -q "verified attestation" signatures.txt

      - name: Create GitHub release
        # Release notes are this version's section of CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "rust-fetch $VERSION" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
