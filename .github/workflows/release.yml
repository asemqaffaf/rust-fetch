name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Optional: without it, npm trusted publishing (OIDC) is used
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm-module
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install JS dev dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./wasm-module/pkg/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          npm run test:rust
          (cd wasm-module && wasm-pack test --node)
          npm run test:js
          npm run size
          npm run api:check

      - name: Choose npm dist-tag
        # Older majors (e.g. a 1.x patch after 2.0) must not become "latest"
        run: |
          major=${VERSION%%.*}
          latest=$(npm view rust-fetch version 2>/dev/null || echo 0.0.0)
          if [[ "$VERSION" == *-* ]]; then
            tag=next
          elif [ "$major" -lt "${latest%%.*}" ]; then
            tag="v$major"
          else
            tag=latest
          fi
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $VERSION with dist-tag $tag"

      - name: Check whether this version is already published
        # Makes the workflow safe to re-run after a later step failed
        run: |
          if npm view "rust-fetch@$VERSION" version >/dev/null 2>&1; then
            echo "rust-fetch@$VERSION is already on npm; skipping publish"
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Use npm 11.5.1+ (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Publish to npm (token)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN != ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to npm (trusted publishing)
        if: env.ALREADY_PUBLISHED != 'true' && env.NPM_TOKEN == ''
        working-directory: wasm-module/pkg
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        # Release notes are this version's section of CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "rust-fetch $VERSION" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
