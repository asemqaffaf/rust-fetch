version: 2
updates:
  - package-ecosystem: cargo
    directory: /wasm-module
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # reqwest 0.13 (its latest release) depends on wasm-streams 0.5. A second wasm-streams in the
      # build exports the same wasm-bindgen types twice and the Wasm tests fail to link. Remove this
      # once a reqwest release moves to wasm-streams 0.6 or later.
      - dependency-name: wasm-streams
        versions: [">=0.6.0"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      native-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/docs", "/examples"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # This alias tests our minimum supported TypeScript version, not latest.
      - dependency-name: typescript-5.2
      # The tests hand undici's ProxyAgent and global dispatcher to Node's built-in WebSocket, so
      # undici stays on the major Node bundles; undici 8 also needs Node 22.19, and CI tests Node 20.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
