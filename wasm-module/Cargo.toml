[package]
name = "rust-fetch"
version = "2.8.1"
edition = "2021"
authors = ["Asem Qaffaf <asem@qaffaf.com>"]
license = "MIT OR Apache-2.0"
description = "Resilient HTTP client for JavaScript, TypeScript and Rust: fetch() with timeouts, retries, typed errors, interceptors, upload and download progress, and WebSockets, from one Rust core compiled to WebAssembly for browsers and Node.js"
repository = "https://github.com/asemqaffaf/rust-fetch"
homepage = "https://asemqaffaf.github.io/rust-fetch/"
keywords = ["http-client", "fetch", "retry", "wasm", "webassembly"]
categories = ["wasm", "web-programming", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Private harness entry points; never enabled in the published Wasm build.
fuzzing = []

[dependencies]
wasm-bindgen = "0.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "EventTarget", "Headers", "ProgressEvent", "ReadableStream", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseType", "Url", "UrlSearchParams", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestResponseType", "XmlHttpRequestUpload"] }
futures-util = { version = "0.3", default-features = false }
pin-project-lite = "0.2"
wasm-streams = "0.5"
serde_urlencoded = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = "0.2"

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[profile.release]
# "s" with one codegen unit: per-request overhead back to 2.6.1's level with
# a smaller module than "z" with the default 16 units; "z" with one unit is
# smaller still but keeps the slower request path (#179).
opt-level = "s"
lto = true
codegen-units = 1

# Optimize Wasm binary size with `-Os` while capping single-caller inlining at
# 500 ops so large async request futures aren't fused into one cold function (#180).
# `--converge` runs passes to a fixed point and `--strip-producers` drops the
# producer custom section. `--low-memory-unused` is omitted because Rust's
# stack-first wasm32 layout grows the stack downward toward address 0.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--one-caller-inline-max-function-size=500", "--converge", "--strip-producers"]

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2
