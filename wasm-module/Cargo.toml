[package]
name = "rust-fetch"
version = "2.2.1"
edition = "2021"
authors = ["Asem Qaffaf <asem@qaffaf.com>"]
license = "MIT OR Apache-2.0"
description = "Resilient HTTP client for JavaScript, TypeScript and Rust: fetch() with timeouts, retries, typed errors, interceptors, upload and download progress, and WebSockets, from one Rust core compiled to WebAssembly for browsers and Node.js"
repository = "https://github.com/asemqaffaf/rust-fetch"
homepage = "https://github.com/asemqaffaf/rust-fetch#readme"
keywords = ["http-client", "fetch", "retry", "wasm", "webassembly"]
categories = ["wasm", "web-programming", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "EventTarget", "Headers", "ProgressEvent", "Request", "RequestInit", "Response", "UrlSearchParams", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestResponseType", "XmlHttpRequestUpload"] }
futures-util = { version = "0.3", default-features = false }
wasm-streams = "0.5"
serde_urlencoded = "0.7"

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[profile.release]
opt-level = "z"
lto = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2
