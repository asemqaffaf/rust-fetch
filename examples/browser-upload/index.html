<!doctype html>
<meta charset="utf-8" />
<title>rust-fetch: upload with progress</title>
<main>
  <h1>Upload a file</h1>
  <input id="file" type="file" />
  <button id="send" type="button">Upload</button>
  <button id="cancel" type="button" disabled>Cancel</button>
  <p><progress id="bar" value="0" max="1"></progress></p>
  <p id="status">Choose a file</p>
</main>
<script type="module" src="./main.mjs"></script>
